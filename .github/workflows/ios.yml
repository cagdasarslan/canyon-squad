# Canyon Squad iOS uygulamasını GitHub'ın macOS sunucusunda imzasız olarak derler ve .ipa dosyasını indirilebilir yapar.
# İmzalama ve telefona kurulum Windows'ta Sideloadly ile ücretsiz Apple ID kullanılarak yapılır.
name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Oyunu derle (Vite → dist)
        run: npm run build

      - name: iOS projesini oluştur
        run: npx cap add ios

      - name: Simge, ad ve ekran yönü
        run: |
          cp resources/icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Canyon Squad" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Canyon Squad" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || true

      - name: Senkronize et
        run: npx cap sync ios

      - name: Derle (imzasız)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr CanyonSquad.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CanyonSquad-ipa
          path: CanyonSquad.ipa
          retention-days: 30
